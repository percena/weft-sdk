name: Release

# Manual trigger only. The publish step supports two auth paths (NPM_TOKEN
# secret, or NPM_TRUSTED_PUBLISHING repo var for OIDC trusted publishing;
# permissions below grant contents:write, pull-requests:write, id-token:write)
# — note that as of 2026-08-06 NEITHER is configured (no repo/org secret, no
# npm-side trusted-publisher link), so a dispatch cannot publish until a
# maintainer sets one up. Releases stay manual so a human gates every
# `npm publish` of @percena/weft (attestation comes from the registry-side
# publish flow; publishConfig no longer carries a provenance key — a bad
# publish can't be undone). This is now the ONLY changesets workflow: on
# workflow_dispatch it
# runs changesets/action, which opens/updates a "chore: version packages" PR
# when there are pending changesets, and publishes when there are none — so a
# release is a two-step manual flow (dispatch → merge PR → dispatch again).
# The former scheduled .github/workflows/changeset-version.yml was removed:
# daily auto version-PRs were unwanted; release stays fully manual.
# Prerequisite for opening the version PR with GITHUB_TOKEN: enable "Allow
# GitHub Actions to create and approve pull requests" in repo Settings →
# Actions → General → Workflow permissions. To switch to automatic releases
# on push to main:
#   1. Confirm NPM_TOKEN (or NPM_TRUSTED_PUBLISHING=true) is set.
#   2. Keep that repo setting enabled (see above).
#   3. Change `on:` to:  on: { push: { branches: [main] } }
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # NPM_TOKEN is intentionally NOT a job-level env var — it would otherwise be
    # readable by `pnpm install/build/test` (which run repo code) before publish.
    # It is scoped to the changesets publish step below. NPM_TRUSTED_PUBLISHING
    # is a non-secret var gating the OIDC path, safe to expose job-wide.
    env:
      NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Only the OIDC trusted-publishing path needs a current npm CLI. On the
      # NPM_TOKEN path this upgrade is actively harmful: with the OIDC env
      # present, `changeset publish` → pnpm delegates to the npm CLI, and
      # current npm hard-errors on pnpm's `--no-git-checks` flag
      # (EUNKNOWNCONFIG — runs 31103868585/31104561618). With the token
      # present and no upgrade, pnpm publishes natively via NODE_AUTH_TOKEN.
      - name: Ensure npm supports trusted publishing (OIDC path only)
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run validate
      - run: pnpm run test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node wrote an .npmrc referencing ${NODE_AUTH_TOKEN}; supply it
          # so the (non-OIDC) token publish path authenticates instead of using
          # setup-node's placeholder.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
